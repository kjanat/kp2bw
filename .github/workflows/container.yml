# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Container
on:
  pull_request:
    paths:
      - Dockerfile
      - Dockerfile.dockerignore
      - scripts/vw-bw.sh
      - scripts/release*.py
      - src/**
      - pyproject.toml
      - uv.lock
      - tests/container_image_test.py
      - tests/container_publish_test.py
      - tests/Dockerfile.vaultwarden
      - tests/fixtures/**
      - .github/workflows/container.yml
      - .github/workflows/publish.yml
  workflow_call:
    inputs:
      distribution-artifact: { type: string, required: true }
      version: { type: string, required: true }
      attest: { type: boolean, default: false }
permissions: { contents: read }
defaults: { run: { shell: bash } }
env: { MISE_MINIMUM_RELEASE_AGE: "0s", MISE_NPM_PACKAGE_MANAGER: npm }
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      bw: ${{ steps.resolve.outputs.bw }}
      vw: ${{ steps.resolve.outputs.vw }}
      python: ${{ steps.resolve.outputs.python }}
      node: ${{ steps.resolve.outputs.node }}
      server: ${{ steps.resolve.outputs.server }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - if: inputs.distribution-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: "${{ inputs.distribution-artifact }}", path: dist }
      - if: inputs.distribution-artifact == ''
        run: uv build --no-sources --wheel
      - name: Resolve versions and immutable base images
        id: resolve
        env: { EXPECTED_VERSION: "${{ inputs.version }}" }
        run: |
          python - <<'PY'
          import email, glob, json, os, re, urllib.request, zipfile
          wheels = glob.glob('dist/kp2bw-*.whl')
          assert len(wheels) == 1, 'Expected exactly one kp2bw wheel'
          with zipfile.ZipFile(wheels[0]) as wheel:
              metadata = email.message_from_bytes(wheel.read(next(n for n in wheel.namelist() if n.endswith('.dist-info/METADATA'))))
          assert metadata['Name'] == 'kp2bw'
          version = metadata['Version']
          assert not os.environ['EXPECTED_VERSION'] or version == os.environ['EXPECTED_VERSION']
          assert re.fullmatch(r'[A-Za-z0-9_.-]+', version)
          resolved = {}
          for variant, package in [('bw', '@bitwarden%2fcli'), ('vw', '@kjanat%2fvaultwarden-cli')]:
              with urllib.request.urlopen(f'https://registry.npmjs.org/{package}', timeout=30) as response:
                  versions = json.load(response)['versions']
              stable = [v for v in versions if re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', v)]
              resolved[variant] = max(stable, key=lambda v: tuple(map(int, v.split('.'))))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
              for variant, cli_version in resolved.items():
                  output.write(f'{variant}={cli_version}\n')
          print('Resolved CLI versions:', resolved)
          PY
          printf 'python=python:3.14-slim-trixie@%s\n' "$(crane digest python:3.14-slim-trixie)" >> "$GITHUB_OUTPUT"
          printf 'node=node:26-trixie-slim@%s\n' "$(crane digest node:26-trixie-slim)" >> "$GITHUB_OUTPUT"
          server=$(crane ls ghcr.io/dani-garcia/vaultwarden | python -c 'import re,sys; print(max((s.strip() for s in sys.stdin if re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+\n?",s)),key=lambda s:tuple(map(int,s.split(".")))))')
          printf 'server=ghcr.io/dani-garcia/vaultwarden@%s\n' "$(crane digest "ghcr.io/dani-garcia/vaultwarden:$server")" >> "$GITHUB_OUTPUT"
      - name: Smoke test the distribution used by every image
        run: uv run --isolated --no-project --with dist/kp2bw-*.whl tests/smoke_test.py
      - name: Check CLI adapter and publication tags
        run: uv run python tests/container_publish_test.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: container-wheel, path: "dist/kp2bw-*.whl", if-no-files-found: error }

  validate:
    name: image (${{ matrix.cli }}, ${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        cli: [vw, bw]
        include:
          - { arch: amd64, runner: ubuntu-26.04 }
          - { arch: arm64, runner: ubuntu-26.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions: { contents: read, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: container-wheel, path: dist }
      - name: Build the disposable server
        env: { SERVER_IMAGE: "${{ needs.prepare.outputs.server }}" }
        run: |
          docker build --file tests/Dockerfile.vaultwarden --tag kp2bw-container-fixture \
            --build-arg "VAULTWARDEN_IMAGE=$SERVER_IMAGE" tests
      - name: Run the disposable server
        id: server
        background: true
        run: |
          exec docker run --rm --name kp2bw-container-fixture -p 127.0.0.1:18443:443 \
            -e I_REALLY_WANT_VOLATILE_STORAGE=true -e SIGNUPS_ALLOWED=false \
            -e DOMAIN=https://localhost:18443 -e ROCKET_PORT=443 \
            -e 'ROCKET_TLS={certs="/ssl/cert.pem",key="/ssl/key.pem"}' kp2bw-container-fixture
      - name: Check server readiness
        id: server-ready
        background: true
        run: >-
          curl --fail --silent --show-error --retry 60 --retry-all-errors
          --retry-delay 1 --retry-max-time 90 --max-time 5
          --cacert tests/fixtures/vaultwarden-certs/cert.pem https://localhost:18443/alive
      - name: Build the production image
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CLI_VERSION: ${{ matrix.cli == 'vw' && needs.prepare.outputs.vw || needs.prepare.outputs.bw }}
          CLI_PACKAGE: ${{ matrix.cli == 'vw' && '@kjanat/vaultwarden-cli' || '@bitwarden/cli' }}
          CLI: ${{ matrix.cli }}
          PYTHON_IMAGE: ${{ needs.prepare.outputs.python }}
          NODE_IMAGE: ${{ needs.prepare.outputs.node }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker build --platform "linux/$ARCH" --tag "kp2bw-production:$CLI-$ARCH" \
            --build-arg "KP2BW_VERSION=$VERSION" --build-arg "CLI_VERSION=$CLI_VERSION" --build-arg "CLI_PACKAGE=$CLI_PACKAGE" \
            --build-arg "REVISION=$GITHUB_SHA" --build-arg "PYTHON_IMAGE=$PYTHON_IMAGE" \
            --build-arg "NODE_IMAGE=$NODE_IMAGE" .
      - wait: server-ready
      - name: Test the actual image
        env:
          KP2BW_CONTAINER_IMAGE: kp2bw-production:${{ matrix.cli }}-${{ matrix.arch }}
          KP2BW_CONTAINER_VERSION: ${{ needs.prepare.outputs.version }}
          KP2BW_CONTAINER_BW_VERSION: ${{ matrix.cli == 'vw' && needs.prepare.outputs.vw || needs.prepare.outputs.bw }}
          KP2BW_CONTAINER_CLI_PACKAGE: ${{ matrix.cli == 'vw' && '@kjanat/vaultwarden-cli' || '@bitwarden/cli' }}
          KP2BW_CONTAINER_ARCH: ${{ matrix.arch }}
        run: uv run python tests/container_image_test.py
      - name: Save the tested image
        env: { ARCH: "${{ matrix.arch }}", CLI: "${{ matrix.cli }}" }
        run: docker save "kp2bw-production:$CLI-$ARCH" --output "/tmp/container-$CLI-$ARCH.tar"
      - name: Attest the tested image archive
        if: inputs.attest
        id: provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with: { subject-path: "/tmp/container-${{ matrix.cli }}-${{ matrix.arch }}.tar" }
      - if: inputs.attest
        env: { BUNDLE: "${{ steps.provenance.outputs.bundle-path }}", CLI: "${{ matrix.cli }}", ARCH: "${{ matrix.arch }}" }
        run: cp "$BUNDLE" "/tmp/container-$CLI-$ARCH.sigstore.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-${{ matrix.cli }}-${{ matrix.arch }}
          path: /tmp/container-${{ matrix.cli }}-${{ matrix.arch }}.*
          compression-level: 0
          retention-days: 90
      - cancel: server
