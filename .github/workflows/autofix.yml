# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: autofix.ci
on:
  push: { branches: [master] }
  pull_request:
  workflow_call:
permissions: { contents: read }
jobs:
  autofix:
    if: github.event.pull_request.stack == null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: kjanat/runner@b32ea932a1813ae0be44e755c16df9f9f5ca86a4 # master
      - uses: kjanat/install-dprint@v2
      - if: ${{ github.event.pull_request.user.login == 'renovate[bot]' }}
        run: bun install --lockfile-only --ignore-scripts
      - run: runner install -fk fmt:ci ruff:check:fix

      - if: ${{ github.event_name != 'pull_request' }}
        run: run dprint:update

      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1
