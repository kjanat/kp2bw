# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: autofix.ci
on:
  push: { branches: [master] }
  pull_request:
  workflow_call:
permissions: { contents: read }
jobs:
  autofix:
    if: github.event.pull_request.stack == null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with: { install_args: bun uv python }
      - uses: kjanat/runner@ca62fac18b7e708f50cff0356cec65c39d6a0e9f # master
      - uses: kjanat/install-dprint@v2
      - if: ${{ github.event.pull_request.user.login == 'renovate[bot]' }}
        run: bun install --lockfile-only --ignore-scripts
      - run: runner install -fk fmt:ci ruff:check:fix

      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1
