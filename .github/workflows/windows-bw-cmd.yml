# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Windows CLI launchers
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push: { branches: [master], paths-ignore: ["**/*.md", "**/*dprint*", "**/*docker*"] }
permissions: {}
jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { pull-requests: read }
    outputs: { launchers: "${{ steps.filter.outputs.launchers }}" }
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            launchers:
              - "**"
              - "!**/*.md"
              - "!**/*dprint*"
              - "!**/*docker*"

  cmd-shim:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result == 'skipped' || needs.changes.outputs.launchers == 'true') }}
    runs-on: windows-latest
    permissions: { contents: read }
    timeout-minutes: 15
    strategy: { fail-fast: false, matrix: { pm: [npm, bun], cli: [bw, vw] } }
    env:
      KP2BW_CLI: ${{ matrix.cli }}
      CLI_PACKAGE: ${{ matrix.cli == 'vw' && '@kjanat/vaultwarden-cli' || '@bitwarden/cli' }}
    defaults: { run: { shell: pwsh } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .tool-versions, package-manager-cache: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: matrix.pm == 'bun'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync

      # npm/bun installs provide .cmd and .ps1 launchers for both CLIs.
      - name: Install CLI via ${{ matrix.pm }}
        env: { PM: "${{ matrix.pm }}" }
        run: "& $env:PM install -g $env:CLI_PACKAGE"

      # Diagnostic only: PowerShell's Get-Command prefers bw.ps1, but kp2bw uses
      # Python's shutil.which (PATHEXT-aware), which resolves bw.cmd. The smoke
      # test below is the actual gate via resolve_cli_command.
      - name: Diagnose CLI resolution
        run: | # Py for syntax highlighting mostly.
          $commands = (Get-Command $env:KP2BW_CLI -All | Format-Table CommandType, Name, Source -AutoSize | Out-String).Trim()
          $pyWhich = & python -c 'import os, shutil; print(shutil.which(os.environ["KP2BW_CLI"]))' | Out-String -NoNewline
          $pyJoinedComments = $pyWhich.Trim().Split("`n") -join "`n# "
          $log = @"
          ``PATHEXT``:

          ~~~python
          $env:PATHEXT
          ~~~

          ~~~sh
          $($commands)
          ~~~

          ~~~python
          shutil.which("$env:KP2BW_CLI")
          # $($pyJoinedComments)
          ~~~
          "@; if ($env:GITHUB_STEP_SUMMARY) { $log | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }
          $log

      - name: Run Windows CLI launcher smoke test
        env: { KP2BW_RUN_WIN_CMD_SMOKE: 1 }
        run: uv run tests/windows_bw_cmd_smoke.py

      - name: Check isolated npx bootstrap
        if: matrix.cli == 'vw' && matrix.pm == 'npm'
        run: uv run tests/npx_bootstrap_test.py

  windows:
    needs: [changes, cmd-shim]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - env: { RESULTS: "${{ join(needs.*.result, ' ') }}" }
        run: |
          for result in ${RESULTS}; do
            [[ ${result} == success || ${result} == skipped ]]
          done
