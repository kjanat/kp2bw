# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Integration (Bitwarden CLI)
on:
  pull_request:
  push: { branches: [master] }
  workflow_dispatch:
permissions: {}
jobs:
  bitwarden:
    permissions: { contents: read }
    uses: $/.github/workflows/integration-docker.yml
    with: { lane: bitwarden }
