# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Publish
on:
  release: { types: [released, prereleased] }
  workflow_dispatch:
    inputs:
      version: { description: "Version number (e.g. v3.1.7)", type: string }
      dry: { description: "Do not publish", type: boolean, default: false }
permissions: {}
defaults: { run: { shell: bash } }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    outputs:
      name: ${{ steps.check.outputs.name }}
      version: ${{ steps.check.outputs.version }}
      pypi_url: ${{ steps.check.outputs.pypi_url }}
    steps:
      - id: check
        uses: $/.github/actions/version-check

  integration:
    needs: check
    permissions: { contents: read }
    uses: $/.github/workflows/integration-docker.yml

  publish:
    needs: [check, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: { name: pypi-kp2bw, url: "${{ needs.check.outputs.pypi_url }}" }
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync
      - name: Stamp build revision
        run: |
          sha="$(git rev-parse HEAD)"
          {
            cat <<'EOF'
          """Build-time metadata; the release workflow stamps BUILD_SHA before ``uv build``."""

          EOF
            printf 'BUILD_SHA: str | None = "%s"\n' "${sha}"
          } > src/kp2bw/build_info.py
      - run: uv build --no-sources

      # Check that basic features work and we didn't miss to include crucial files
      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with dist/kp2bw-*.whl tests/smoke_test.py
      - name: Smoke test (source distribution)
        run: uv run --isolated --no-project --with dist/kp2bw-*.tar.gz tests/smoke_test.py

      - name: Publish
        run: uv publish
