# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Publish pykeepass-stubs
on:
  push: { tags: [stubs-v*] }
  workflow_dispatch:
    inputs:
      version: { description: "Version number (e.g. 0.1.0 or stubs-v0.1.0)", type: string }
      dry: { description: "Do not publish", type: boolean, default: false }
permissions: {}
defaults: { run: { shell: bash } }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    outputs:
      name: ${{ steps.check.outputs.name }}
      version: ${{ steps.check.outputs.version }}
      pypi_url: ${{ steps.check.outputs.pypi_url }}
    steps:
      - id: check
        uses: $/.github/actions/version-check
        with: { package: pykeepass-stubs, tag-prefixes: "stubs-,v" }

  validate:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read }
    outputs: { artifact-id: "${{ steps.artifact.outputs.artifact-id }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen
      - run: uv build --package pykeepass-stubs --no-sources --out-dir dist-stubs

      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with dist-stubs/pykeepass_stubs-*.whl --with pykeepass --with basedpyright tests/stubs_smoke_test.py
      - name: Smoke test (source distribution)
        run: uv run --isolated --no-project --with dist-stubs/pykeepass_stubs-*.tar.gz --with pykeepass --with basedpyright tests/stubs_smoke_test.py

      - name: Upload validated distributions
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pykeepass-stubs-distributions
          path: |
            dist-stubs/pykeepass_stubs-*.whl
            dist-stubs/pykeepass_stubs-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [check, validate]
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: { name: pypi-pykeepass-stubs, url: "${{ needs.check.outputs.pypi_url }}" }
    permissions: { id-token: write, contents: read }
    steps:
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Download validated distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact-id }}
          path: dist-stubs
          merge-multiple: true
      - name: Publish
        run: uv publish dist-stubs/pykeepass_stubs-*.whl dist-stubs/pykeepass_stubs-*.tar.gz
