# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: PR Test Comment
on: { pull_request_target: { types: [opened, synchronize, reopened, closed] } }
permissions: { contents: read, issues: write, pull-requests: write }
concurrency: { group: "pr-test-comment-${{ github.event.pull_request.number }}", cancel-in-progress: true }
jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Create, update, or archive PR comment
        uses: $/.github/actions/pr-test-comment
        with:
          python-version: "3.14"
          cli-name: kp2bw
          cli-examples: |
            # Show version
            {cmd} --version
            # Migrate KeePass DB (interactive password prompts)
            {cmd} vault.kdbx
            # Non-interactive with env vars
            KP2BW_KEEPASS_PASSWORD=kppass KP2BW_BITWARDEN_PASSWORD=bwpass {cmd} vault.kdbx -y
