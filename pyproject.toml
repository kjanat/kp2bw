[project]
name            = "kp2bw"
version         = "3.10.1"
description     = "Migrate KeePass databases to Bitwarden and Vaultwarden with attachments, passkeys and history"
readme          = "README.md"
requires-python = ">=3.15"
license         = "MIT"
license-files   = ["LICENSE"]
keywords        = ["bitwarden", "cli", "kdbx", "keepass", "keepassxc", "migration", "passkey", "password-manager", "vaultwarden"]
classifiers     = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.15",
  "Topic :: Security",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies    = [
  "cryptography>=50.0.2",
  "httpx>=0.28.0",
  "pykeepass>=4.1.1.post1,<4.3",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.3",
  "rich>=13.0.0",
]

[[project.authors]]
name  = "Kaj Kowalski"
email = "info@kajkowalski.nl"

[project.urls]
Changelog     = "https://github.com/kjanat/kp2bw/blob/master/CHANGELOG.md"
Documentation = "https://kjanat.github.io/kp2bw/"
Funding       = "https://github.com/sponsors/kjanat"
Issues        = "https://github.com/kjanat/kp2bw/issues"
Repository    = "https://github.com/kjanat/kp2bw"

[project.scripts]
kp2bw = "kp2bw.cli:main"

[dependency-groups]
dev     = [
  { include-group = "codegen" },
  { include-group = "lint" },
  { include-group = "stubs" },
  { include-group = "test" },
]
codegen = ["datamodel-code-generator[ruff]>=0.31"]
lint    = [
  "basedpyright>=1.38.1",
  "ruff>=0.15.2",
  "tombi>=0.7.32",
  "ty>=0.0.18",
]
stubs   = ["pykeepass-stubs", "types-pyyaml>=6.0.12.20260518"]
test    = ["coverage>=7.13.4", "pytest>=9.0.2", "pytest-cov>=7.0.0"]

[build-system]
requires      = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[tool.pyright]
venvPath         = "."
venv             = ".venv"
typeCheckingMode = "strict"
pythonVersion    = "3.15"

# Tests exercise module-internal helpers; allow private access here without
# weakening strict mode elsewhere.
[[tool.pyright.executionEnvironments]]
root               = "tests"
reportPrivateUsage = "none"

[tool.ruff]
preview        = true
target-version = "py315"

[tool.uv.sources]
pykeepass-stubs.workspace = true

[tool.uv.workspace]
members = ["packages/*"]
